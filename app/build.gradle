plugins {
    id 'com.android.application'
}

def vCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()

android {
    namespace 'pl.michwie.planszowki'
    compileSdk 35

    defaultConfig {
        applicationId "pl.michwie.planszowki"
        minSdk 26
        targetSdk 35
        versionCode vCode
        versionName "1.0." + vCode
    }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "planszowki"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

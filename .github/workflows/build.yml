name: Zbuduj aplikację

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Pobierz Firebase SDK i czcionki
        run: |
          set -e
          V=10.12.2
          D=app/src/main/assets/www/vendor
          mkdir -p $D/fonts
          for f in app auth firestore; do
            curl -fsSL "https://www.gstatic.com/firebasejs/$V/firebase-$f-compat.js" -o "$D/firebase-$f-compat.js"
          done
          F=https://cdn.jsdelivr.net/npm/@fontsource
          curl -fsSL "$F/orbitron@5/files/orbitron-latin-600-normal.woff2" -o $D/fonts/orbitron-600.woff2 || true
          curl -fsSL "$F/orbitron@5/files/orbitron-latin-800-normal.woff2" -o $D/fonts/orbitron-800.woff2 || true
          curl -fsSL "$F/share-tech-mono@5/files/share-tech-mono-latin-400-normal.woff2" -o $D/fonts/sharetechmono-400.woff2 || true
          get(){ curl -fsSL "$F/$1@5/files/$2" -o "$D/fonts/$3" || echo "::warning::brak czcionki $2"; }
          get cinzel cinzel-latin-700-normal.woff2 cinzel-700.woff2
          get cinzel cinzel-latin-ext-700-normal.woff2 cinzel-ext-700.woff2
          get eb-garamond eb-garamond-latin-400-normal.woff2 garamond-400.woff2
          get eb-garamond eb-garamond-latin-ext-400-normal.woff2 garamond-ext-400.woff2
          get chakra-petch chakra-petch-latin-600-normal.woff2 chakra-600.woff2
          get chakra-petch chakra-petch-latin-ext-600-normal.woff2 chakra-ext-600.woff2
          get chakra-petch chakra-petch-latin-700-normal.woff2 chakra-700.woff2
          get chakra-petch chakra-petch-latin-ext-700-normal.woff2 chakra-ext-700.woff2
          get jetbrains-mono jetbrains-mono-latin-400-normal.woff2 jetbrains-400.woff2
          get jetbrains-mono jetbrains-mono-latin-ext-400-normal.woff2 jetbrains-ext-400.woff2
          get nunito nunito-latin-400-normal.woff2 nunito-400.woff2
          get nunito nunito-latin-ext-400-normal.woff2 nunito-ext-400.woff2
          get nunito nunito-latin-800-normal.woff2 nunito-800.woff2
          get nunito nunito-latin-ext-800-normal.woff2 nunito-ext-800.woff2
          get exo-2 exo-2-latin-400-normal.woff2 exo2-400.woff2
          get exo-2 exo-2-latin-ext-400-normal.woff2 exo2-ext-400.woff2
          get exo-2 exo-2-latin-800-normal.woff2 exo2-800.woff2
          get exo-2 exo-2-latin-ext-800-normal.woff2 exo2-ext-800.woff2
          get audiowide audiowide-latin-400-normal.woff2 audiowide-400.woff2
          get audiowide audiowide-latin-ext-400-normal.woff2 audiowide-ext-400.woff2
          ls -la $D $D/fonts

      - name: Sprawdź polskie znaki w czcionkach
        run: |
          pip install --quiet fonttools brotli
          python3 - <<'PY'
          import glob, os
          from fontTools.ttLib import TTFont
          D = "app/src/main/assets/www/vendor/fonts"
          PL = "ąćęłńóśźżĄĆĘŁŃÓŚŹŻ"
          fams = {}
          for f in glob.glob(D + "/*.woff2"):
              base = os.path.basename(f).replace("-ext", "").rsplit("-", 1)[0] + "-" + os.path.basename(f).rsplit("-", 1)[1]
              fams.setdefault(base, set()).update(TTFont(f).getBestCmap().keys())
          for fam, cm in sorted(fams.items()):
              miss = "".join(c for c in PL if ord(c) not in cm)
              print(fam.ljust(24), "brak:" if miss else "OK", miss)
              if miss and not fam.startswith(("orbitron", "sharetechmono")):
                  print(f"::warning::Czcionka {fam} nie ma polskich znaków: {miss}")
          PY

      - name: Wpisz wersję i repozytorium
        run: |
          VN=$(tr -d ' \r\n' < VERSION)
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          sed -i "s|__REPO__|${{ github.repository }}|; s|__VERSION__|$VN|; s|__BUILD__|${{ github.run_number }}|" app/src/main/assets/www/config.js
          grep -n "repo\|version" app/src/main/assets/www/config.js

      - name: Klucz do podpisu
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Brak sekretu KEYSTORE_BASE64 – buduję wersję testową bez publikowania"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | tr -d " \r\n" | base64 -d > "$RUNNER_TEMP/planszowki.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zbuduj APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && format('{0}/planszowki.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk planszowki.apk

      - uses: actions/upload-artifact@v4
        with:
          name: planszowki-apk
          path: planszowki.apk

      - name: Opublikuj wersję
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-build${{ github.run_number }}
          name: Wersja ${{ env.VERSION_NAME }}
          body: "Wersja ${{ env.VERSION_NAME }} (kompilacja ${{ github.run_number }}). Plik do instalacji: planszowki.apk"
          files: planszowki.apk
          make_latest: true

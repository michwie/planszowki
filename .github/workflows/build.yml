name: Zbuduj aplikację

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Pobierz Firebase SDK i czcionki
        run: |
          set -e
          V=10.12.2
          D=app/src/main/assets/www/vendor
          mkdir -p $D/fonts
          for f in app auth firestore; do
            curl -fsSL "https://www.gstatic.com/firebasejs/$V/firebase-$f-compat.js" -o "$D/firebase-$f-compat.js"
          done
          F=https://cdn.jsdelivr.net/npm/@fontsource
          curl -fsSL "$F/orbitron@5/files/orbitron-latin-600-normal.woff2" -o $D/fonts/orbitron-600.woff2 || true
          curl -fsSL "$F/orbitron@5/files/orbitron-latin-800-normal.woff2" -o $D/fonts/orbitron-800.woff2 || true
          curl -fsSL "$F/share-tech-mono@5/files/share-tech-mono-latin-400-normal.woff2" -o $D/fonts/sharetechmono-400.woff2 || true
          get(){ curl -fsSL "$F/$1@5/files/$2" -o "$D/fonts/$3" || echo "::warning::brak czcionki $2"; }
          get cinzel cinzel-latin-700-normal.woff2 cinzel-700.woff2
          get cinzel cinzel-latin-ext-700-normal.woff2 cinzel-ext-700.woff2
          get eb-garamond eb-garamond-latin-400-normal.woff2 garamond-400.woff2
          get eb-garamond eb-garamond-latin-ext-400-normal.woff2 garamond-ext-400.woff2
          get fredoka fredoka-latin-400-normal.woff2 fredoka-400.woff2
          get fredoka fredoka-latin-ext-400-normal.woff2 fredoka-ext-400.woff2
          get fredoka fredoka-latin-600-normal.woff2 fredoka-600.woff2
          get fredoka fredoka-latin-ext-600-normal.woff2 fredoka-ext-600.woff2
          get exo-2 exo-2-latin-400-normal.woff2 exo2-400.woff2
          get exo-2 exo-2-latin-ext-400-normal.woff2 exo2-ext-400.woff2
          get exo-2 exo-2-latin-800-normal.woff2 exo2-800.woff2
          get exo-2 exo-2-latin-ext-800-normal.woff2 exo2-ext-800.woff2
          get audiowide audiowide-latin-400-normal.woff2 audiowide-400.woff2
          get audiowide audiowide-latin-ext-400-normal.woff2 audiowide-ext-400.woff2
          ls -la $D $D/fonts

      - name: Wpisz wersję i repozytorium
        run: |
          sed -i "s|__REPO__|${{ github.repository }}|; s|__VERSION__|${{ github.run_number }}|" app/src/main/assets/www/config.js
          grep -n "repo\|version" app/src/main/assets/www/config.js

      - name: Klucz do podpisu
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Brak sekretu KEYSTORE_BASE64 – buduję wersję testową bez publikowania"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | tr -d " \r\n" | base64 -d > "$RUNNER_TEMP/planszowki.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zbuduj APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && format('{0}/planszowki.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk planszowki.apk

      - uses: actions/upload-artifact@v4
        with:
          name: planszowki-apk
          path: planszowki.apk

      - name: Opublikuj wersję
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Wersja ${{ github.run_number }}
          body: "Plik do instalacji: planszowki.apk"
          files: planszowki.apk
          make_latest: true
